# HTTP
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}

# CORS — set CORS_ORIGINS to your Vercel URL after deploy (e.g. https://myapp.vercel.app)
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:/.*/}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.access-control-allow-credentials=false

# Disable Quarkus dev services (no Docker-in-Docker on Render)
quarkus.datasource.devservices.enabled=false
